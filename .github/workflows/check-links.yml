name: 매일 링크 점검·배포

on:
  schedule:
    - cron: '0 21 * * *' # 매일 06:00 KST
  push:
    branches: [main] # 코드·데이터를 고쳐 올리면 바로 배포
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-and-deploy
  cancel-in-progress: false

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      # 예약 실행·수동 실행 때만 점검한다 (push 때는 이미 올라온 결과로 배포만)
      - name: 링크 점검
        if: github.event_name != 'push'
        run: npm run check:links

      - name: 점검 결과 커밋
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- src/data/status.json src/data/status-log.json; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "linkdc-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/status.json src/data/status-log.json
          git commit -m "chore: 링크 점검 결과 $(TZ=Asia/Seoul date +%F)"
          git push
        # GITHUB_TOKEN 으로 올린 커밋은 다른 워크플로를 깨우지 않으므로, 배포는 아래 단계에서 바로 한다.

      - name: 빌드
        run: npm run build

      - name: Cloudflare 배포
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
